server:
  port: ${PORT:8080}

spring:
  application:
    name: sales-management-system
  datasource:
    url: jdbc:h2:mem:salesdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml
  h2:
    console:
      enabled: true
      path: /h2-console

# Security & JWT Configuration
app:
  jwt:
    # 256-bit base64-encoded secret key
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    # Access Token expiration: 15 minutes (in milliseconds: 15 * 60 * 1000 = 900000)
    access-token-expiration-ms: 900000
    # Refresh Token expiration: 7 days (in milliseconds: 7 * 24 * 60 * 60 * 1000 = 604800000)
    refresh-token-expiration-ms: 604800000
